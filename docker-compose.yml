services:
  # --- 1. POSTGRES DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: campus-db
    restart: always
    environment:
      POSTGRES_USER: campus_app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: CampusCompile_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- 2. REDIS MESSAGE QUEUE ---
  redis:
    image: redis:alpine
    container_name: campus-redis
    restart: always
    ports:
      - "6379:6379"

  # --- 3. GO API BACKEND ---
  api:
    build: 
      context: ./server
    container_name: campus-api
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - minio # 👈 Ensure MinIO starts before the API
    env_file:
      - ./.env
    environment:
      - DB_HOST=db       
      - REDIS_HOST=redis 
      # 👈 Inject MinIO connection details for the Go AWS SDK
      - S3_ENDPOINT=http://minio:9000 
      - S3_ACCESS_KEY=campus_admin
      - S3_SECRET_KEY=campus_password

  # --- 4. PYTHON EXECUTION WORKER ---
  worker:
    build: 
      context: ./worker
    container_name: campus-worker
    depends_on:
      - db
      - redis
      - minio # 👈 Ensure MinIO starts before the Worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
      - sandbox_volume:/sandbox_shared
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      # 👈 Inject MinIO connection details for boto3
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=campus_admin
      - S3_SECRET_KEY=campus_password

  # --- 5. REACT FRONTEND ---
  frontend:
    build:
      context: ./frontend
    container_name: campus-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080

  # --- 6. MINIO STORAGE ---
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web UI port
    environment:
      MINIO_ROOT_USER: "campus_admin"
      MINIO_ROOT_PASSWORD: "campus_password"
    volumes:
      - minio_data:/data

# Define the persistent storage
volumes:
  pgdata:
  sandbox_volume:
    name: sandbox_volume
  minio_data: # 👈 ADDED: The missing root volume declaration
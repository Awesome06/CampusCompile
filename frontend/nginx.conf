# 1. The HTTP Redirect (Forces everyone to use HTTPS)
server {
    listen 80;
    server_name campuscompile.com www.campuscompile.com;
    return 301 https://$host$request_uri;
}

# 2. The Secure HTTPS Server
server {
    listen 443 ssl;
    server_name campuscompile.com www.campuscompile.com;

    # The Let's Encrypt Keys
    ssl_certificate /etc/letsencrypt/live/campuscompile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuscompile.com/privkey.pem;

    # Modern SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Standard Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Allow larger payloads if users upload code files, avatars, or test cases
    client_max_body_size 15M;

    # React Frontend Routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Go API Reverse Proxy
    location /api {
        proxy_pass http://api:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- CRITICAL FOR SSE AND CODE EXECUTION ---
        proxy_buffering off;          # Prevents Nginx from batching SSE events
        proxy_cache off;              # Ensures real-time data is never cached
        proxy_read_timeout 300s;      # Prevents 504 Gateway Timeout if a user's code infinite loops or takes 60 seconds to run
        chunked_transfer_encoding on; # Required for SSE streams
    }
}
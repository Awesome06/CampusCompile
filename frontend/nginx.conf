# 1. The HTTP Redirect (Forces everyone to use HTTPS)
server {
    listen 80;
    server_name campuscompile.com www.campuscompile.com;
    return 301 https://$host$request_uri;
}

# 2. The Secure HTTPS Server
server {
    listen 443 ssl;
    server_name campuscompile.com www.campuscompile.com;

    # The Let's Encrypt Keys
    ssl_certificate /etc/letsencrypt/live/campuscompile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuscompile.com/privkey.pem;

    # Modern SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # React Frontend Routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Go API Reverse Proxy
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
services:
  api:
    ports:
      - "8080:8080"
    restart: always

  worker:
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://${GCP_PUBLIC_IP}:8080/api
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  minio:
    ports:
      - "9000:9000"
